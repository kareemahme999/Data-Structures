<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Red-Black Tree banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <style>
      .edge { stroke:#94a3b8; stroke-width:2.5; fill:none; }
      .blk { fill:#020617; stroke:#cbd5e1; stroke-width:3; }
      .red { fill:#dc2626; stroke:#fecaca; stroke-width:3; }
      .t { font-family:Consolas,'Courier New',monospace; font-size:20px; font-weight:700; fill:#ffffff; text-anchor:middle; }
      .title { font-family:'Segoe UI',Arial,sans-serif; font-weight:800; font-size:66px; fill:url(#accent); }
      .sub { font-family:'Segoe UI',Arial,sans-serif; font-size:23px; fill:#e2e8f0; letter-spacing:2px; }
      .small { font-family:'Segoe UI',Arial,sans-serif; font-size:17px; fill:#cbd5e1; }
      .pop { opacity:0; animation:pop 0.7s ease-out forwards; }
      .d1 { animation-delay:0.2s; } .d2 { animation-delay:0.7s; } .d3 { animation-delay:1.2s; }
      @keyframes pop { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>

  <text x="60" y="135" class="title">Red-Black Tree</text>
  <text x="64" y="185" class="sub">RECOLOR · ROTATE · BALANCE</text>
  <text x="64" y="228" class="small">Header-only C++ implementation</text>
  <text x="64" y="254" class="small">Search, insert and delete in O(log n)</text>

  <g class="edge">
    <path d="M950 84 L830 116"/><path d="M950 84 L1070 116"/>
    <path d="M830 164 L770 201"/><path d="M830 164 L890 201"/>
    <path d="M1070 164 L1010 201"/><path d="M1070 164 L1130 201"/>
  </g>

  <g class="pop d1">
    <circle class="blk" cx="950" cy="60" r="26"/><text class="t" x="950" y="67">10</text>
  </g>
  <g class="pop d2">
    <circle class="blk" cx="830" cy="140" r="26"/><text class="t" x="830" y="147">5</text>
    <circle class="blk" cx="1070" cy="140" r="26"/><text class="t" x="1070" y="147">15</text>
  </g>
  <g class="pop d3">
    <circle class="red" cx="770" cy="228" r="26"/><text class="t" x="770" y="235">3</text>
    <circle class="red" cx="890" cy="228" r="26"/><text class="t" x="890" y="235">7</text>
    <circle class="red" cx="1010" cy="228" r="26"/><text class="t" x="1010" y="235">12</text>
    <circle class="red" cx="1130" cy="228" r="26"/><text class="t" x="1130" y="235">18</text>
  </g>
</svg>
